name: Server persistence tests

on:
  push:
    branches: [main, development, 'feature/**']
    paths: ['server/**', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ska_organizer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ska_organizer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql://skao_ci_test:ci-test-password@127.0.0.1:5432/ska_organizer_test
      SKAO_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Create a test database owner without database creation privileges
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PGPASSWORD: ci-test-password
        run: |
          docker exec -i --env PGPASSWORD "$POSTGRES_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE skao_ci_test WITH LOGIN PASSWORD 'ci-test-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          ALTER DATABASE ska_organizer_test OWNER TO skao_ci_test;
          SQL
      - name: Install local recipe photo reader
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
      - name: Mock API suite
        run: npm test -- --silent
      - name: PostgreSQL API and migration suite
        run: npm run test:postgres -- --silent
      - name: Save restart fixtures
        run: npm run test:restart:prepare
      - name: Restart PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker restart "$POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d ska_organizer_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify records in a new Node process
        run: npm run test:restart:verify
