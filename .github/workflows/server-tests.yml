name: Server persistence tests

on:
  push:
    branches: [development, 'feature/SKAO-17-*', 'feature/SKAO-18-*', 'feature/SKAO-19-*']
    paths: ['server/**', '.github/workflows/server-tests.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: ska_organizer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d ska_organizer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-test-password@127.0.0.1:5432/ska_organizer_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Mock API suite
        run: npm test -- --silent
      - name: PostgreSQL API and migration suite
        run: npm run test:postgres -- --silent
      - name: Save restart fixtures
        run: npm run test:restart:prepare
      - name: Restart PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker restart "$POSTGRES_CONTAINER"
          for attempt in {1..30}; do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres -d ska_organizer_test; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Verify records in a new Node process
        run: npm run test:restart:verify
