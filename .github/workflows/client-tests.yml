name: Client build and planner tests

on:
  push:
    branches: [development, 'feature/SKAO-18-*']
    paths: ['client/**', '.github/workflows/client-tests.yml']
  pull_request:
    paths: ['client/**', '.github/workflows/client-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - name: Install browser-test server dependencies
        working-directory: server
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
