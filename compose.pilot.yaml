name: skao-pilot

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    image: postgres:17-bookworm
    # Database errors must not log the SQL statement or its values.
    command: [postgres, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse]
    environment:
      POSTGRES_DB: ska_organizer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_admin_password, app_password]
    volumes:
      - pilot_database:/var/lib/postgresql/data
      - ./deploy/pilot/init-db.sh:/docker-entrypoint-initdb.d/10-skao.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [storage]
    restart: unless-stopped
    logging: *logging

  server:
    image: skao-pilot-server:${PILOT_RELEASE:?Run scripts/pilot.ps1 init first}
    build:
      context: .
      dockerfile: deploy/pilot/server.Dockerfile
    environment:
      NODE_ENV: production
      DB_ADAPTER: sequelize
      DATABASE_HOST: db
      DATABASE_USER: ska_app
      DATABASE_NAME: ${PILOT_DATABASE:-ska_organizer}
      DATABASE_PASSWORD_FILE: /run/secrets/app_password
      DB_SCHEMA: public
      PORT: '3001'
      APP_ORIGINS: https://${PILOT_HOST:?Set the pilot hostname}:8443
      FACILITY_TIME_ZONE: ${FACILITY_TIME_ZONE:-America/Los_Angeles}
    secrets: [app_password]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/api/ready', {signal: AbortSignal.timeout(12000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 15s
      start_period: 15s
      retries: 3
    networks: [storage, frontend]
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    logging: *logging

  web:
    image: skao-pilot-web:${PILOT_RELEASE:?Run scripts/pilot.ps1 init first}
    build:
      context: .
      dockerfile: deploy/pilot/web.Dockerfile
    environment:
      PILOT_HOST: ${PILOT_HOST:?Set the pilot hostname}
    ports:
      - '${PILOT_BIND:-127.0.0.1}:8443:8443'
    volumes:
      - pilot_certificates:/data
      - pilot_web_config:/config
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      # Keep TLS verification and expose failures in Docker's health history.
      test: [CMD, /usr/local/bin/skao-web-healthcheck]
      interval: 20s
      timeout: 15s
      start_period: 20s
      retries: 3
    networks: [frontend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    logging: *logging

  tools:
    image: skao-pilot-tools:${PILOT_RELEASE:?Run scripts/pilot.ps1 init first}
    build:
      context: .
      dockerfile: deploy/pilot/tools.Dockerfile
    profiles: [operations]
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: ${PILOT_DATABASE:-ska_organizer}
      PILOT_RELEASE: ${PILOT_RELEASE}
      BACKUP_ROOT: /backups
    secrets: [db_admin_password, app_password]
    volumes:
      - type: bind
        source: ${PILOT_BACKUP_DIR:?Set a private backup directory}
        target: /backups
    networks: [storage]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

networks:
  storage: {internal: true}
  frontend: {}
volumes:
  pilot_database: {name: skao_pilot_database}
  pilot_certificates: {name: skao_pilot_certificates}
  pilot_web_config: {name: skao_pilot_web_config}
secrets:
  db_admin_password: {file: ./.pilot/secrets/db-admin-password}
  app_password: {file: ./.pilot/secrets/app-password}
